name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --project python --frozen --managed-python --python 3.12
      - run: pnpm verify release --automated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            artifacts/release/**/report.json
            artifacts/release/**/evidence-template.json
            artifacts/release/**/*.log
            artifacts/release/**/installation/results.json
